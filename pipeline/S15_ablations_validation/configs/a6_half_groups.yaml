# S15 A6 data: half of each subset's training groups (whole groups, chosen per fold).
# Everything else matches pipeline/S11_unet_baseline/configs/unet_tuned.yaml (100 epochs).
# Run: uv run python -m urbanwind.dl.train --config pipeline/S15_ablations_validation/configs/a6_half_groups.yaml --seed 0 --folds 0
exp_id: s15_a6_half_groups
stage: S15
out_dir: pipeline/S15_ablations_validation/outputs/runs
split: grouped
model:
  name: unet
  kwargs:
    widths: [24, 48, 96, 192]
    bottleneck: 384
    dropout: 0.08
loss: l1
lr: 0.00036
min_lr: 1.0e-05
weight_decay: 6.5e-05
batch: 16
max_epochs: 100
patience: 30
inner_val_fraction: 0.15
patch: 256
border: 16
mirror: true
amp: true
clip: 1.0
mirror_tta: true
native_upsample: bilinear
train_group_fraction: 0.5
